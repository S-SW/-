#数据库配置信息
#MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/yjsyy?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
#Hikari 连接池：命名为 HrsysHikari，日志中即可看到连接池的启动/建连/池统计信息
spring.datasource.hikari.pool-name=HrsysHikari
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=10
#MyBatis
mybatis.mapper-locations=classpath:com/fdk/hrsys/dao/*.xml
mybatis.type-aliases-package=com.fdk.hrsys.entity